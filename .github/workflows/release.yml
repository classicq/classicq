name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CGO_ENABLED: '0'

jobs:
  verify-tag:
    name: Verify tag is on master
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Tag must point to a commit on master
        run: |
          git fetch origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Tag ${GITHUB_REF_NAME} ($GITHUB_SHA) is not on master. Tag master after merging the PR and running git pull."
            exit 1
          fi

  build:
    name: Build ${{ matrix.platform }}
    needs: verify-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-amd64
            target: x86_64-linux-gnu
            goos: linux
            goarch: amd64
            binary: classicq-linux-amd64
            sdl: libSDL3.so.0
            artifact_path: |
              assets/classicq-linux-amd64
              assets/libSDL3.so.0
          - os: ubuntu-latest
            platform: windows-amd64
            target: x86_64-windows-gnu
            goos: windows
            goarch: amd64
            binary: classicq-windows-amd64.exe
            sdl: SDL3.dll
            artifact_path: |
              assets/classicq-windows-amd64.exe
              assets/SDL3.dll
          - os: macos-latest
            platform: macos-arm64
            target: aarch64-macos
            goos: darwin
            goarch: arm64
            binary: classicq-macos-arm64
            sdl: libSDL3.dylib
            artifact_path: assets/classicq-macos-arm64.app

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          cache-key: ${{ matrix.target }}

      - name: Build SDL3 shared library
        shell: bash
        run: |
          BUILD_ARGS="-Drelease=true -Dcpu=baseline"
          if [ "${{ matrix.platform }}" = "windows-amd64" ]; then
            BUILD_ARGS="-Dtarget=${{ matrix.target }} $BUILD_ARGS"
          fi
          for i in 1 2 3; do
            zig build sdl-shared $BUILD_ARGS && break || {
              echo "::warning::SDL3 build attempt $i failed"
              [ $i -eq 3 ] && exit 1
              rm -rf .zig-cache
              sleep 2
            }
          done
          ls -l "assets/${{ matrix.sdl }}"

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Windows icon
        if: matrix.goos == 'windows'
        run: go run github.com/akavel/rsrc@v0.10.2 -ico assets/icons/classicq.ico -arch amd64 -o cmd/classicq/rsrc_windows_amd64.syso

      - name: Build release binary
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          LDFLAGS="-s -w"
          if [ "$GOOS" = "windows" ]; then
            LDFLAGS="$LDFLAGS -H windowsgui"
          fi
          go build -trimpath -ldflags "$LDFLAGS" -o "assets/${{ matrix.binary }}" ./cmd/classicq

      - name: Assemble app bundle
        if: matrix.goos == 'darwin'
        run: |
          APP=assets/classicq-macos-arm64.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          mv assets/classicq-macos-arm64 assets/libSDL3.dylib "$APP/Contents/MacOS/"
          cp assets/macos/Info.plist "$APP/Contents/"
          cp assets/icons/classicq.icns "$APP/Contents/Resources/"

      - name: Upload binary artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.binary }}
          path: ${{ matrix.artifact_path }}
          retention-days: 1
          if-no-files-found: error

  package-and-release:
    name: Package and create release
    needs: build
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.reltype.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all binary artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Determine version
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - name: Determine release type
        id: reltype
        run: |
          if [[ "$GITHUB_REF" =~ -(rc|beta|alpha) ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble per-OS ZIPs
        run: bash .github/scripts/package.sh "${{ steps.version.outputs.VERSION }}"

      - name: Generate SHA256 checksums
        run: |
          sha256sum classicQ-*.zip > SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'classicQ-*.zip'

      - name: Create draft release with assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            classicQ-*.zip
            SHA256SUMS
          generate_release_notes: true
          draft: true
          prerelease: ${{ steps.reltype.outputs.prerelease }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${GITHUB_REF#refs/tags/}" --repo "${{ github.repository }}" --draft=false

  update-page:
    name: Update download page
    needs: package-and-release
    if: needs.package-and-release.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Build releases.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VER="${TAG#v}"
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          jq -n \
            --arg ver "$VER" \
            --arg win "$BASE/classicQ-$VER-windows-amd64.zip" \
            --arg lin "$BASE/classicQ-$VER-linux-amd64.zip" \
            --arg mac "$BASE/classicQ-$VER-macos-arm64.zip" \
            '{version: $ver, downloads: {windows: $win, linux: $lin, macos: $mac}}' \
            > releases.json
      - name: Deploy to site repo
        env:
          DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/stdin ~/.ssh/key <<< "$DEPLOY_KEY"
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/key -o IdentitiesOnly=yes"
          git clone --depth 1 git@github.com:classicq/classicq.github.io.git site
          install -m 644 releases.json site/releases.json
          cd site
          git add releases.json
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
            commit -m "Update releases.json for $TAG" || { echo "No changes"; exit 0; }
          git push
