name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  verify-tag:
    name: Verify tag is on master
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Tag must point to a commit on master
        run: |
          git fetch origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Tag ${GITHUB_REF_NAME} ($GITHUB_SHA) is not on master. Tag master after merging the PR and running git pull."
            exit 1
          fi

  build:
    name: Build ${{ matrix.platform }}
    needs: verify-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-amd64
            target: x86_64-linux-gnu
            artifact: classicq-linux-amd64
            artifact_path: assets/classicq-linux-amd64
          - os: ubuntu-latest
            platform: windows-amd64
            target: x86_64-windows-gnu
            artifact: classicq-windows-amd64.exe
            artifact_path: assets/classicq-windows-amd64.exe
          - os: macos-latest
            platform: macos-arm64
            target: aarch64-macos
            artifact: classicq-macos-arm64
            artifact_path: assets/classicq-macos-arm64.app

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
          cache-key: ${{ matrix.target }}

      - name: Build release binary
        shell: bash
        run: |
          BUILD_ARGS="-Drelease=true -Dcpu=baseline"
          if [ "${{ matrix.platform }}" = "windows-amd64" ]; then
            BUILD_ARGS="-Dtarget=${{ matrix.target }} $BUILD_ARGS"
          fi
          for i in 1 2 3; do
            zig build $BUILD_ARGS && break || {
              echo "::warning::Build attempt $i failed"
              [ $i -eq 3 ] && exit 1
              rm -rf .zig-cache
              sleep 2
            }
          done

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact_path }}
          retention-days: 1
          if-no-files-found: error

  package-and-release:
    name: Package and create release
    needs: build
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.reltype.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all binary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Determine version
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - name: Determine release type
        id: reltype
        run: |
          if [[ "$GITHUB_REF" =~ -(rc|beta|alpha) ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble per-OS ZIPs
        run: |
          VER=${{ steps.version.outputs.VERSION }}

          mkdir -p assets-base
          cp -r assets/. assets-base/
          rm -f assets-base/classicq-windows-amd64.exe
          rm -f assets-base/classicq-linux-amd64
          rm -rf assets-base/classicq-macos-arm64.app
          cp LICENSE assets-base/
          cp README.md assets-base/

          # Windows ZIP
          PLATFORM="windows-amd64"
          BIN="classicq-windows-amd64.exe"
          STAGE="classicQ-${VER}-${PLATFORM}"
          mkdir -p "$STAGE"
          cp -r assets-base/* "$STAGE/"
          cp "artifacts/${BIN}/${BIN}" "$STAGE/"
          zip -r "${STAGE}.zip" "$STAGE"

          # Linux ZIP
          PLATFORM="linux-amd64"
          BIN="classicq-linux-amd64"
          STAGE="classicQ-${VER}-${PLATFORM}"
          mkdir -p "$STAGE"
          cp -r assets-base/* "$STAGE/"
          cp "artifacts/${BIN}/${BIN}" "$STAGE/"
          chmod +x "$STAGE/${BIN}"
          zip -r "${STAGE}.zip" "$STAGE"

          # macOS ZIP - preserve .app bundle
          PLATFORM="macos-arm64"
          STAGE="classicQ-${VER}-${PLATFORM}"
          APP="$STAGE/classicq-macos-arm64.app"
          mkdir -p "$STAGE" "$APP"
          cp -r assets-base/* "$STAGE/"
          cp -r artifacts/classicq-macos-arm64/. "$APP/"
          chmod +x "$APP/Contents/MacOS/classicq-macos-arm64"
          zip -ry "${STAGE}.zip" "$STAGE"

      - name: Generate SHA256 checksums
        run: |
          sha256sum classicQ-*.zip > SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'classicQ-*.zip'

      - name: Create draft release with assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            classicQ-*.zip
            SHA256SUMS
          generate_release_notes: true
          draft: true
          prerelease: ${{ steps.reltype.outputs.prerelease }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${GITHUB_REF#refs/tags/}" --repo "${{ github.repository }}" --draft=false

  update-page:
    name: Update download page
    needs: package-and-release
    if: needs.package-and-release.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Build releases.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VER="${TAG#v}"
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          jq -n \
            --arg ver "$VER" \
            --arg win "$BASE/classicQ-$VER-windows-amd64.zip" \
            --arg lin "$BASE/classicQ-$VER-linux-amd64.zip" \
            --arg mac "$BASE/classicQ-$VER-macos-arm64.zip" \
            '{version: $ver, downloads: {windows: $win, linux: $lin, macos: $mac}}' \
            > releases.json
      - name: Deploy to site repo
        env:
          DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/stdin ~/.ssh/key <<< "$DEPLOY_KEY"
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/key -o IdentitiesOnly=yes"
          git clone --depth 1 git@github.com:classicq/classicq.github.io.git site
          install -m 644 releases.json site/releases.json
          cd site
          git add releases.json
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
            commit -m "Update releases.json for $TAG" || { echo "No changes"; exit 0; }
          git push
