name: Build

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'build.zig'
      - 'build.zig.zon'
      - 'assets/icons/**'
      - 'assets/macos/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [master]
    paths:
      - 'src/**'
      - 'build.zig'
      - 'build.zig.zon'
      - 'assets/icons/**'
      - 'assets/macos/**'
      - '.github/workflows/build.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-amd64
            target: x86_64-linux-gnu
            artifact: classicq-linux-amd64
            artifact_path: assets/classicq-linux-amd64
          - os: ubuntu-latest
            platform: windows-amd64
            target: x86_64-windows-gnu
            artifact: classicq-windows-amd64.exe
            artifact_path: assets/classicq-windows-amd64.exe
          - os: macos-latest
            platform: macos-arm64
            target: aarch64-macos
            artifact: classicq-macos-arm64
            artifact_path: assets/classicq-macos-arm64.app

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
          cache-key: ${{ matrix.target }}

      - name: Build
        shell: bash
        run: |
          BUILD_ARGS="-Drelease=true -Dcpu=baseline"
          if [ "${{ matrix.platform }}" = "windows-amd64" ]; then
            BUILD_ARGS="-Dtarget=${{ matrix.target }} $BUILD_ARGS"
          fi
          for i in 1 2 3; do
            zig build $BUILD_ARGS && break || {
              echo "::warning::Build attempt $i failed"
              [ $i -eq 3 ] && exit 1
              rm -rf .zig-cache
              sleep 2
            }
          done

      - name: Smoke test
        if: matrix.target == 'x86_64-linux-gnu'
        run: |
          file assets/classicq-linux-amd64
          ldd assets/classicq-linux-amd64 || true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact_path }}
          retention-days: 7
          if-no-files-found: error
